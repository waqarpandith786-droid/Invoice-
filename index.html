<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sales Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#17202a;color:white;padding:18px 22px;position:sticky;top:0;z-index:5}
.header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000d}.label{color:#68737d;font-size:13px}.value{font-size:25px;font-weight:bold;margin-top:7px}
.panel{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}
h2{margin:0 0 16px;font-size:18px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:bold;color:#4e5963}
input,select,textarea{width:100%;padding:11px;border:1px solid #d7dde2;border-radius:8px;font-size:14px;background:white}
textarea{min-height:70px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold}
.primary{background:#2563eb;color:white}.secondary{background:#e8edf2;color:#17202a}.danger{background:#dc3545;color:white}.success{background:#198754;color:white}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{max-width:360px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:13px}
th{background:#f8fafb;color:#56616b}.right{text-align:right}
.empty{text-align:center;color:#7b8790;padding:30px}
.smallbtn{padding:6px 9px;font-size:12px;margin-right:4px}
footer{text-align:center;color:#7b8790;font-size:12px;padding:15px}
@media(max-width:800px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.form{grid-template-columns:1fr}.wrap{padding:0 10px}.panel{padding:15px}}
</style>
</head>
<body>
<header><div class="header"><h1>📊 My Sales Manager</h1><span id="status">Offline • Saved on this device</span></div></header>

<div class="wrap">
<section class="cards">
  <div class="card"><div class="label">Total Sales</div><div class="value" id="totalSales">0</div></div>
  <div class="card"><div class="label">Total Revenue</div><div class="value" id="totalRevenue">₹0.00</div></div>
  <div class="card"><div class="label">Today's Revenue</div><div class="value" id="todayRevenue">₹0.00</div></div>
</section>

<section class="panel">
<h2 id="formTitle">Add New Sale</h2>
<form id="saleForm">
<div class="form">
<div class="field"><label>Customer Name</label><input id="customer" required placeholder="e.g. Ahmed"></div>
<div class="field"><label>Phone</label><input id="phone" placeholder="Optional"></div>
<div class="field"><label>Date</label><input id="date" type="date" required></div>
<div class="field"><label>Payment Method</label><select id="payment"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Credit</option></select></div>
<div class="field full"><label>Products / Items (up to 6)</label></div>
<div class="field"><label>Item 1</label><input id="product1" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity1" type="number" min="0" step="1" value="1"></div><div class="field"><label>Price (₹)</label><input id="price1" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount1" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Item 2</label><input id="product2" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity2" type="number" min="0" step="1" value="0"></div><div class="field"><label>Price (₹)</label><input id="price2" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount2" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Item 3</label><input id="product3" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity3" type="number" min="0" step="1" value="0"></div><div class="field"><label>Price (₹)</label><input id="price3" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount3" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Item 4</label><input id="product4" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity4" type="number" min="0" step="1" value="0"></div><div class="field"><label>Price (₹)</label><input id="price4" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount4" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Item 5</label><input id="product5" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity5" type="number" min="0" step="1" value="0"></div><div class="field"><label>Price (₹)</label><input id="price5" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount5" type="number" min="0" step="0.01" value="0"></div>
<div class="field"><label>Item 6</label><input id="product6" placeholder="Product / Item"></div><div class="field"><label>Qty</label><input id="quantity6" type="number" min="0" step="1" value="0"></div><div class="field"><label>Price (₹)</label><input id="price6" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Discount (₹)</label><input id="discount6" type="number" min="0" step="0.01" value="0"></div>
<div class="field full"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div>
</div>
<div class="actions">
<button class="primary" type="submit" id="saveBtn">Save Sale</button>
<button class="secondary" type="button" id="cancelBtn" style="display:none">Cancel Edit</button>
</div>
</form>
</section>

<section class="panel">
<h2>Sales History</h2>
<div class="toolbar">
<input id="search" placeholder="🔎 Search customer, phone, product...">
<input id="filterDate" type="date" title="Filter by date">
<button class="secondary" id="clearFilter">Clear Filters</button>
<button class="success" id="exportBtn">Export Excel (.xlsx)</button>
<button class="secondary" id="importBtn">Import Backup</button>
<input id="fileInput" type="file" accept=".json" hidden>
</div>
<div class="table-wrap">
<table><thead><tr><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th><th>Actions</th></tr></thead>
<tbody id="salesBody"></tbody></table>
</div>
</section>
<footer>Your sales are stored locally in your browser. Use Export Backup regularly to keep a copy.</footer>
</div>

<script>
const KEY='my_sales_manager_v1';
let sales=JSON.parse(localStorage.getItem(KEY)||'[]');
let editingId=null;
const $=id=>document.getElementById(id);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
$('date').value=today();

function save(){localStorage.setItem(KEY,JSON.stringify(sales));render();}
function total(s){
  if(Array.isArray(s.items)) return s.items.reduce((sum,it)=>sum+Math.max(0,(Number(it.quantity)||0)*(Number(it.price)||0)-(Number(it.discount)||0)),0);
  return Math.max(0,(Number(s.quantity)||0)*(Number(s.price)||0)-(Number(s.discount)||0));
}
function itemList(s){
  if(Array.isArray(s.items)) return s.items;
  return s.product ? [{product:s.product,quantity:s.quantity,price:s.price,discount:s.discount||0}] : [];
}
function itemSummary(s){return itemList(s).map(i=>i.product).filter(Boolean).join(', ')}


function xesc(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function colName(n){
  let x=''; n++;
  while(n){let r=(n-1)%26;x=String.fromCharCode(65+r)+x;n=Math.floor((n-1)/26)}
  return x;
}
function crc32(buf){
  let c, table=crc32.table;
  if(!table){table=crc32.table=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0}}
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++)crc=table[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
const utf8 = str => new TextEncoder().encode(str);
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(arrs){let len=arrs.reduce((a,b)=>a+b.length,0),out=new Uint8Array(len),p=0;arrs.forEach(a=>{out.set(a,p);p+=a.length});return out}
function zipStore(files){
  const locals=[], centrals=[]; let offset=0;
  files.forEach(f=>{
    const name=utf8(f.name), data=typeof f.data==='string'?utf8(f.data):f.data, crc=crc32(data);
    const lh=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name]);
    locals.push(concatBytes([lh,data]));
    const ch=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
    centrals.push(ch); offset+=lh.length+data.length;
  });
  const central=concatBytes(centrals), local=concatBytes(locals);
  const eocd=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(local.length),u16(0)]);
  return concatBytes([local,central,eocd]);
}
function createXLSX(data){
  const rows=[['Date','Customer Name','Phone','Product / Item','Quantity','Price per Item (₹)','Discount (₹)','Total (₹)','Payment Method','Notes']];
  data.slice().sort((a,b)=>(a.date+a.created).localeCompare(b.date+b.created)).forEach(s=>{
    const its=itemList(s); rows.push([s.date,s.customer,s.phone,itemSummary(s),its.reduce((n,i)=>n+(Number(i.quantity)||0),0),its.reduce((n,i)=>n+(Number(i.price)||0),0),its.reduce((n,i)=>n+(Number(i.discount)||0),0),Number(total(s)),s.payment,s.notes]);
  });
  let sheetRows='';
  rows.forEach((r,ri)=>{
    let cells='';
    r.forEach((v,ci)=>{
      const ref=colName(ci)+(ri+1);
      if(typeof v==='number') cells+=`<c r="${ref}" t="n"><v>${v}</v></c>`;
      else cells+=`<c r="${ref}" t="inlineStr"><is><t>${xesc(v)}</t></is></c>`;
    });
    sheetRows+=`<row r="${ri+1}">${cells}</row>`;
  });
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sales" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellXfs count="2"><xf/><xf fontId="1"/></cellXfs></styleSheet>`},
    {name:'xl/worksheets/sheet1.xml',data:`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols><col min="1" max="10" width="18" customWidth="1"/></cols><sheetData>${sheetRows}</sheetData><autoFilter ref="A1:J${rows.length}"/><pane/></worksheet>`}
  ];
  return zipStore(files);
}
function printInvoice(id){
  const s=sales.find(x=>x.id===id); if(!s)return;
  const invoiceNo='INV-'+String(s.id).slice(-8);
  const w=window.open('','_blank','width=800,height=700');
  if(!w){alert('Please allow pop-ups for this website to print the invoice.');return;}
  w.document.write(`<!doctype html><html><head><title>${invoiceNo}</title><style>
  body{font-family:Arial,sans-serif;margin:20px;color:#222}.invoice{height:47vh;padding:10px 15px;border-bottom:1px dashed #777;page-break-inside:avoid}
  .top{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding-bottom:10px}
  h1{margin:0;font-size:25px}.muted{color:#666}.box{margin-top:15px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{background:#f1f1f1}
  .right{text-align:right}.total{font-size:18px;font-weight:bold}.notes{margin-top:12px}
  .copy-title{text-align:center;font-weight:bold;font-size:11px;margin-bottom:5px;color:#666}
  @media print{body{margin:8mm}.noprint{display:none}.invoice{height:46vh}}
  </style></head><body>
  <div class="invoice">
    <div class="copy-title">CUSTOMER COPY</div>
    <div class="top"><div><h1>Pandith Cotton</h1><div>Mobile: 9596116751</div><div class="muted">INVOICE • ${invoiceNo}</div></div><div><b>Date:</b> ${escapeHtml(s.date)}</div></div>
    <div class="box details"><div><b>Customer:</b><br>${escapeHtml(s.customer)}</div><div><b>Phone:</b><br>${escapeHtml(s.phone||'-')}</div></div>
    <table><tr><th>Product / Item</th><th>Qty</th><th>Price</th><th>Discount</th><th class="right">Total</th></tr>
    ${itemList(s).map(i=>`<tr><td>${escapeHtml(i.product)}</td><td>${i.quantity}</td><td>${money(i.price)}</td><td>${money(i.discount)}</td><td class="right">${money((Number(i.quantity)||0)*(Number(i.price)||0)-(Number(i.discount)||0))}</td></tr>`).join('')}</table>
    <div class="box right"><div>Payment: <b>${escapeHtml(s.payment)}</b></div><p class="total">Grand Total: ${money(total(s))}</p></div>
    ${s.notes?`<div class="notes"><b>Notes:</b><br>${escapeHtml(s.notes)}</div>`:''}
    <p style="margin-top:25px;text-align:center" class="muted">Thank you for your business.</p>
  </div>
  <div class="invoice">
    <div class="copy-title">OFFICE COPY</div>
    <div class="top"><div><h1>Pandith Cotton</h1><div>Mobile: 9596116751</div><div class="muted">INVOICE • ${invoiceNo}</div></div><div><b>Date:</b> ${escapeHtml(s.date)}</div></div>
    <div class="box details"><div><b>Customer:</b><br>${escapeHtml(s.customer)}</div><div><b>Phone:</b><br>${escapeHtml(s.phone||'-')}</div></div>
    <table><tr><th>Product / Item</th><th>Qty</th><th>Price</th><th>Discount</th><th class="right">Total</th></tr>
    ${itemList(s).map(i=>`<tr><td>${escapeHtml(i.product)}</td><td>${i.quantity}</td><td>${money(i.price)}</td><td>${money(i.discount)}</td><td class="right">${money((Number(i.quantity)||0)*(Number(i.price)||0)-(Number(i.discount)||0))}</td></tr>`).join('')}</table>
    <div class="box right"><div>Payment: <b>${escapeHtml(s.payment)}</b></div><p class="total">Grand Total: ${money(total(s))}</p></div>
    ${s.notes?`<div class="notes"><b>Notes:</b><br>${escapeHtml(s.notes)}</div>`:''}
    <p style="margin-top:25px;text-align:center" class="muted">Thank you for your business.</p>
  </div>
  <div class="noprint" style="text-align:center;margin-top:15px"><button onclick="window.print()">Print Both Copies</button></div>
  </body></html>`);
  w.document.close();w.focus();
}

function render(){
  const search=$('search').value.toLowerCase().trim(), fd=$('filterDate').value;
  const filtered=sales.filter(s=>{
    const text=[s.customer,s.phone,s.product,s.payment,s.notes].join(' ').toLowerCase();
    return (!search||text.includes(search))&&(!fd||s.date===fd);
  }).sort((a,b)=>(b.date+a.created).localeCompare(a.date+b.created));
  $('salesBody').innerHTML=filtered.length?filtered.map(s=>`
    <tr>
      <td>${escapeHtml(s.date)}</td><td>${escapeHtml(s.customer)}${s.phone?'<br><small>'+escapeHtml(s.phone)+'</small>':''}</td>
      <td>${escapeHtml(itemSummary(s))}</td><td>${itemList(s).reduce((n,i)=>n+(Number(i.quantity)||0),0)}</td><td><b>${money(total(s))}</b></td><td>${escapeHtml(s.payment)}</td>
      <td><button class="success smallbtn" onclick="printInvoice('${s.id}')">Invoice</button><button class="secondary smallbtn" onclick="editSale('${s.id}')">Edit</button><button class="danger smallbtn" onclick="deleteSale('${s.id}')">Delete</button></td>
    </tr>`).join(''):`<tr><td colspan="7" class="empty">No sales found.</td></tr>`;

  const revenue=sales.reduce((a,s)=>a+total(s),0);
  const todayRev=sales.filter(s=>s.date===today()).reduce((a,s)=>a+total(s),0);
  $('totalSales').textContent=sales.length;
  $('totalRevenue').textContent=money(revenue);
  $('todayRevenue').textContent=money(todayRev);
}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

$('saleForm').addEventListener('submit',e=>{
 e.preventDefault();
 const items=[];
 for(let i=1;i<=6;i++){
   const product=$('product'+i).value.trim(), quantity=Number($('quantity'+i).value)||0, price=Number($('price'+i).value)||0, discount=Number($('discount'+i).value)||0;
   if(product && quantity>0) items.push({product,quantity,price,discount});
 }
 if(!items.length){alert('Please enter at least one product/item with quantity.');return;}
 const item={id:editingId||Date.now().toString(),customer:$('customer').value.trim(),phone:$('phone').value.trim(),
 date:$('date').value,items,product:itemSummary({items}),payment:$('payment').value,notes:$('notes').value.trim(),
 created:editingId?(sales.find(x=>x.id===editingId)?.created||Date.now()):Date.now()};
 if(editingId){sales=sales.map(s=>s.id===editingId?item:s)}else sales.push(item);
 localStorage.setItem(KEY,JSON.stringify(sales)); resetForm(); render();
});
function resetForm(){editingId=null;$('saleForm').reset();$('date').value=today();for(let i=1;i<=6;i++){if($('quantity'+i))$('quantity'+i).value=i===1?1:0;if($('discount'+i))$('discount'+i).value=0;}$('formTitle').textContent='Add New Sale';$('saveBtn').textContent='Save Sale';$('cancelBtn').style.display='none';}
$('cancelBtn').onclick=resetForm;

window.editSale=id=>{
 const s=sales.find(x=>x.id===id);if(!s)return;editingId=id;
 ['customer','phone','date','payment','notes'].forEach(k=>$(k).value=s[k]||'');
 for(let i=1;i<=6;i++){const it=itemList(s)[i-1]||{};$('product'+i).value=it.product||'';$('quantity'+i).value=it.quantity||0;$('price'+i).value=it.price||0;$('discount'+i).value=it.discount||0;}
 $('formTitle').textContent='Edit Sale';$('saveBtn').textContent='Update Sale';$('cancelBtn').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'});
};
window.deleteSale=id=>{if(confirm('Delete this sale? This cannot be undone.')){sales=sales.filter(s=>s.id!==id);save();}};
$('search').oninput=render;$('filterDate').oninput=render;
$('clearFilter').onclick=()=>{$('search').value='';$('filterDate').value='';render()};

$('exportBtn').onclick=()=>{
  const wb = createXLSX(sales);
  const blob = new Blob([wb], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sales-report-'+today()+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{
 const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();
 if(confirm('Importing will replace the sales currently saved in this browser. Continue?')){sales=data;save();alert('Backup imported successfully.');}
 }catch{alert('Invalid backup file.')} e.target.value='';};r.readAsText(file);
};
render();
</script>
</body>
</html>
